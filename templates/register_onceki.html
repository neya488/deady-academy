<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEADY ACADEMY - Kayıt</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
<h1>DEADY <span>ACADEMY</span></h1>
<h2>HESAP OLUŞTUR</h2>
{% with messages = get_flashed_messages() %}
{% for message in messages %}
<p>{{ message }}</p>
{% endfor %}
{% endwith %}
<form method="POST">
<input type="email" name="email" placeholder="E-posta adresin" required>
<input type="password" name="password" placeholder="Şifre (en az 8 karakter)" minlength="8" required>
<button class="button" type="submit">KAYIT OL</button>
</form>
<p>Zaten hesabın var mı? <a href="/login">Giriş Yap</a></p>
</main>
</body>
</html>
