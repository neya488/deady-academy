<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DEADY SALVO | Yeni Şifre</title>
<style>
*{box-sizing:border-box}
body{
    margin:0;min-height:100vh;display:flex;align-items:center;
    justify-content:center;padding:20px;
    background:radial-gradient(circle at top,#29102e,#08070e 65%);
    color:#fff;font-family:Arial,sans-serif
}
.card{
    width:100%;max-width:420px;padding:35px;
    background:#15121e;border:1px solid #59305f;
    border-radius:20px;box-shadow:0 0 35px #a0207040
}
h1{text-align:center;color:#e879f9;letter-spacing:3px}
p{text-align:center;color:#aaa;line-height:1.6}
label{display:block;margin:20px 0 8px;color:#e879f9}
input{
    width:100%;padding:15px;background:#090810;
    border:1px solid #49334f;border-radius:10px;
    color:white;font-size:16px
}
button{
    width:100%;margin-top:24px;padding:15px;
    background:linear-gradient(90deg,#8b1c9e,#d946ef);
    border:0;border-radius:10px;color:white;
    font-weight:bold;cursor:pointer;font-size:15px
}
a{display:block;text-align:center;margin-top:20px;color:#e879f9}
.flash{color:#f9a8d4;text-align:center;margin:12px 0}
</style>
</head>
<body>
<div class="card">
<h1>DEADY ∅</h1>
<p>Hesabın için yeni ve güçlü bir şifre belirle.</p>

{% with messages = get_flashed_messages() %}
{% for message in messages %}
<div class="flash">{{ message }}</div>
{% endfor %}
{% endwith %}

<form method="POST">
<label>YENİ ŞİFRE</label>
<input type="password" name="password" placeholder="En az 8 karakter" minlength="8" required>

<label>YENİ ŞİFRE TEKRARI</label>
<input type="password" name="confirm_password" placeholder="Şifreni tekrar gir" minlength="8" required>

<button type="submit">ŞİFREMİ YENİLE</button>
</form>

<a href="/login">Giriş sayfasına dön</a>
</div>
</body>
</html>
